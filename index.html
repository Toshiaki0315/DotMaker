<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DotMaker</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <h1>DotMaker</h1>
        <label class="file-button">
          画像を開く…
          <input id="file-input" type="file" accept="image/png,image/jpeg,image/gif,image/tiff,image/bmp" />
        </label>
        <p id="file-name" class="file-name">未選択</p>
        <div id="controls" class="controls"></div>
        <div id="edit" class="controls"></div>
        <div id="export" class="controls"></div>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </aside>
      <main class="preview">
        <figure><figcaption>元画像 <span id="original-size"></span></figcaption><div class="frame"><img id="original" alt="" /></div></figure>
        <figure><figcaption>変換後 <span id="result-size"></span></figcaption><div class="frame"><img id="result" alt="" /></div></figure>
      </main>
    </div>
  </body>
</html>

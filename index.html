<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DotMaker</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <main class="container">
      <h1>DotMaker</h1>
      <section class="controls">
        <input id="file-input" type="file" accept="image/png,image/jpeg,image/gif,image/tiff,image/bmp" />
        <label>ドットの粗さ <input id="block-size" type="range" min="1" max="64" value="8" /> <span id="block-size-value">8</span></label>
        <label>モード <select id="color-mode"></select></label>
      </section>
      <p id="status"></p>
      <section class="preview">
        <figure><figcaption>元画像</figcaption><img id="original" alt="" /></figure>
        <figure><figcaption>変換後</figcaption><img id="result" alt="" /></figure>
      </section>
    </main>
  </body>
</html>
